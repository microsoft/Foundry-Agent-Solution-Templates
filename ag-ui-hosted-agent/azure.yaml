# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.32.0'
  extensions:
    azure.ai.agents: '>=1.0.0'
    azure.ai.projects: '>=1.1.0'
name: ag-ui-hosted-agent
metadata:
  template: ag-ui-hosted-agent@v1
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  claims-triage:
    host: azure.ai.agent
    project: src/agent
    language: python
    uses: [ai-project]
    kind: hosted
    name: claims-triage
    displayName: Claims Triage Agent
    description: Triages synthetic insurance claims; escalation requires human approval.
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      # The hosting layer captures prompt and response text in traces unless this is false.
      - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
        value: 'false'
    codeConfiguration:
      dependencyResolution: remote_build
      runtime: python_3_13
      entryPoint: main.py
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
  gateway:
    host: containerapp
    project: src/gateway
    language: python
    resourceGroup: ${AZURE_FOUNDRY_RESOURCE_GROUP}
    docker:
      remoteBuild: true
  web:
    host: containerapp
    project: src/web
    language: js
    resourceGroup: ${AZURE_FOUNDRY_RESOURCE_GROUP}
    docker:
      remoteBuild: true
infra:
  layers:
    - provider: microsoft.foundry
      path: infra-foundry
      name: foundry
    - provider: bicep
      path: infra
      module: app
      name: app
      scope: subscription
      dependsOn:
        - foundry
