# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: ">=1.0.0-beta.9"
        azure.ai.connections: ">=1.0.0-beta.4"
        azure.ai.toolboxes: ">=1.0.0-beta.5"
name: apim-hosted-agent
metadata:
    template: apim-hosted-agent@v1
hooks:
    postprovision:
        shell: pwsh
        run: ./scripts/sync-gateway-links.ps1
services:
    project:
        host: azure.ai.project
        deployments:
            - name: gpt-5.6-luna
              model:
                  format: OpenAI
                  name: gpt-5.6-luna
                  version: "2026-07-09"
              sku:
                  capacity: 1
                  name: DataZoneStandard
    tools:
        host: azure.ai.toolbox
        uses:
            - project
        description: Microsoft Learn and GitHub tools through governed APIM MCP gateways.
        tools:
            - connection: github
              name: github
              require_approval: always
              server_label: github
              type: mcp
            - connection: mslearn
              name: microsoftlearn
              require_approval: always
              server_label: microsoftlearn
              type: mcp
    agent:
        name: agent
        kind: hosted
        description: An Agent Framework agent with Foundry Toolbox integration.
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Streaming
        protocols:
            - protocol: responses
              version: 2.0.0
        project: src
        host: azure.ai.agent
        language: python
        hooks:
            postdeploy:
                shell: pwsh
                run: ../scripts/bind-agent-identity.ps1
        uses:
            - project
            - tools
        environmentVariables:
            - name: AGENT_MODEL_DEPLOYMENT
              value: ${APIM_FOUNDRY_MODEL_DEPLOYMENT_NAME}
            - name: AGENT_APIM_PROJECT_ENDPOINT
              value: ${APIM_FOUNDRY_DIRECT_PROJECT_ENDPOINT}
            - name: AGENT_TOOLBOX_ENDPOINT
              value: ${TOOLBOX_TOOLS_MCP_ENDPOINT}
        codeConfiguration:
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
infra:
    layers:
        - provider: microsoft.foundry
          path: .
          name: foundry
        - provider: bicep
          path: infra
          module: apim
          name: apim
          dependsOn:
              - foundry
        - provider: bicep
          path: infra
          module: foundry
          name: foundry-project
          dependsOn:
              - apim
workflows:
    up:
        steps:
            - azd:
                  args:
                      - provision
