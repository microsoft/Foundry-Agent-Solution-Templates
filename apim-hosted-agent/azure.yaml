# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: ">=1.0.0-beta.9"
        azure.ai.connections: ">=1.0.0-beta.3"
        azure.ai.toolboxes: ">=1.0.0-beta.5"
name: apim-hosted-agent
hooks:
    postprovision:
        shell: pwsh
        run: ./scripts/reconcile-gateway-links.ps1
services:
    project:
        host: azure.ai.project
        deployments:
            - name: gpt-5-mini
              model:
                  format: OpenAI
                  name: gpt-5-mini
                  version: "2025-08-07"
              sku:
                  capacity: 10
                  name: GlobalStandard
    mcp:
        host: azure.ai.connection
        uses:
            - project
        authType: None
        category: RemoteTool
        metadata:
            toolEntityId: microsoft-learn
            type: catalog_MCP
        target: https://${APIM_NAME}.azure-api.net/tool-${AZURE_ENV_NAME}-mcp
    tools:
        host: azure.ai.toolbox
        uses:
            - project
            - mcp
        description: Microsoft Learn documentation through an authenticated APIM MCP gateway.
        policies:
            rai_config:
                rai_policy_name: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.CognitiveServices/accounts/${AZURE_AI_ACCOUNT_NAME}/raiPolicies/${GUARDRAIL_POLICY_NAME}
        tools:
            - connection: mcp
              name: mcp
              require_approval: always
              server_label: mcp
              type: mcp
    agent:
        project: hosted-agent
        host: azure.ai.agent
        language: python
        hooks:
            postdeploy:
                shell: pwsh
                run: ../scripts/configure-keyless-model-gateway.ps1
        uses:
            - project
            - tools
        environmentVariables:
            - name: AGENT_MODEL_DEPLOYMENT
              value: gpt-5-mini
            - {
                  name: AGENT_APIM_PROJECT_ENDPOINT,
                  value: "${APIM_KEYLESS_FOUNDRY_PROJECT_ENDPOINT}",
              }
            - name: AGENT_TOOLBOX_ENDPOINT
              value: ${TOOLBOX_TOOLS_MCP_ENDPOINT}
        codeConfiguration:
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: An Agent Framework agent with Foundry Toolbox integration.
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Streaming
        name: agent
        policies:
            - {
                  type: rai_policy,
                  raiPolicyName: REPLACE_WITH_FULL_RAI_POLICY_ARM_ID,
              }
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    layers:
        - provider: microsoft.foundry
          path: .
          name: foundry
        - provider: bicep
          path: infra
          module: foundry
          name: foundry-guardrails
          dependsOn:
              - foundry
        - provider: bicep
          path: infra
          module: apim
          name: apim
          dependsOn:
              - foundry-guardrails
workflows:
    up:
        steps:
            - azd:
                  args:
                      - provision
