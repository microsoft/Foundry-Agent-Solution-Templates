# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.7'
        azure.ai.projects: '>=1.0.0-beta.1'
name: private-network-hosted-agent-bicep-existing-private-acr
metadata:
    template: private-network-hosted-agent@v1
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.1
                version: "2025-11-13"
              name: gpt-5.1
              sku:
                capacity: 10
                name: Standard
    private-search-agent-acr:
        host: azure.ai.agent
        uses:
            - ai-project
        docker:
            remoteBuild: true
        image: ${AZURE_CONTAINER_IMAGE}
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Answers questions from a private, non-sensitive Azure AI Search demo index with stable citations.
        displayName: Private Search Agent - Existing ACR
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: AZURE_SEARCH_ENDPOINT
              value: ${AZURE_SEARCH_ENDPOINT}
            - name: AZURE_SEARCH_INDEX_NAME
              value: ${AZURE_SEARCH_INDEX_NAME}
        kind: hosted
        name: private-search-agent-acr
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: bicep
    path: ../../infra-bicep
