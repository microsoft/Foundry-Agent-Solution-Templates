# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
        azure.ai.projects: '>=1.0.0-beta.1'
name: private-network-hosted-agent
metadata:
    template: private-network-hosted-agent@v1
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.1
                version: "2025-11-13"
              name: gpt-5.1
              sku:
                capacity: 10
                name: Standard
    private-search-agent:
        project: agent/search-agent
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Answers questions from a private, non-sensitive Azure AI Search demo index with stable citations.
        displayName: Private Search Agent
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: AZURE_SEARCH_ENDPOINT
              value: ${AZURE_SEARCH_ENDPOINT}
            - name: AZURE_SEARCH_INDEX_NAME
              value: ${AZURE_SEARCH_INDEX_NAME}
            - name: FOUNDRY_LOCAL_DEVELOPMENT
              value: "false"
        kind: hosted
        name: private-search-agent
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: terraform
    path: ./infra-terraform
