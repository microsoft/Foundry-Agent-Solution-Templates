# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
requiredVersions:
  azd: '>=1.32.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: deep-agents
metadata:
  template: deep-agents@v1
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-4.1-mini
        model:
          format: OpenAI
          name: gpt-4.1-mini
          version: '2025-04-14'
        sku:
          name: GlobalStandard
          capacity: 10
  deep-agents:
    host: azure.ai.agent
    project: src
    language: python
    startupCommand: python -m langchain_azure_ai.agents.hosting.run --protocol responses --option resilient_background=true
    uses: [ai-project]
    kind: hosted
    name: deep-agents
    displayName: Deep Agents Research (Mock Evidence)
    description: Deep Agents research assistant using bundled fictional evidence.
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
        value: 'false'
      - name: AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED
        value: 'false'
      - name: LANGSMITH_TRACING
        value: 'false'
    codeConfiguration:
      dependencyResolution: remote_build
      runtime: python_3_13
      entryPoint: '-m langchain_azure_ai.agents.hosting.run --protocol responses --option resilient_background=true'
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
