# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
requiredVersions:
  azd: '>=1.32.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
    azure.ai.toolboxes: '>=1.0.0-beta.5'
name: deep-agents
metadata:
  template: deep-agents@v1
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.6-luna
        model:
          format: OpenAI
          name: gpt-5.6-luna
          version: '2026-07-09'
        sku:
          name: GlobalStandard
          capacity: 10
  deep-agents-tools:
    host: azure.ai.toolbox
    uses: [ai-project]
    description: Managed web search for Deep Agents research.
    tools:
      - type: web_search
        name: web_search
  deep-agents:
    host: azure.ai.agent
    project: src
    language: python
    startupCommand: python -m langchain_azure_ai.agents.hosting.run --protocol responses --option resilient_background=true
    uses: [ai-project, deep-agents-tools]
    kind: hosted
    name: deep-agents
    displayName: Deep Agents Research
    description: Deep Agents research assistant using Foundry managed web search.
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: TOOLBOX_NAME
        value: deep-agents-tools
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME=gpt-5.6-luna}
      - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
        value: 'false'
      - name: AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED
        value: 'false'
      - name: LANGSMITH_TRACING
        value: 'false'
    codeConfiguration:
      dependencyResolution: remote_build
      runtime: python_3_13
      entryPoint: '-m langchain_azure_ai.agents.hosting.run --protocol responses --option resilient_background=true'
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
