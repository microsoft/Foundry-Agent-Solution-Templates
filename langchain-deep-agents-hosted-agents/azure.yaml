# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: langgraph-deep-agents
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - name: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
              model:
                  format: OpenAI
                  name: gpt-5.6-terra
                  version: '2026-07-09'
              sku:
                  name: GlobalStandard
                  capacity: 607
        endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
    deep-agents-tools:
        host: azure.ai.toolbox
        uses:
            - ai-project
        tools:
            - name: web_search
              type: web_search
    langgraph-deep-agents:
        project: src/langgraph-deep-agents
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
            - deep-agents-tools
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            TERMINAL_ROOT: "~"
            TOOLBOX_NAME: deep-agents-tools
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: A Deep Agents web research assistant hosted on Foundry over the Responses protocol. Demonstrates planning, Foundry web search, state-backed working files, and focused subagent delegation.
        displayName: LangGraph Deep Agents (Responses)
        kind: hosted
        metadata:
            tags:
                - AI Agent Hosting
                - Responses Protocol
                - LangGraph
                - LangChain
                - Deep Agents
                - Multi-Agent
                - Python
        name: langgraph-deep-agents
        protocols:
            - protocol: responses
              version: 2.0.0
    backend:
        project: backend
        host: containerapp
        language: python
        resourceName: ${SERVICE_BACKEND_NAME}
        resourceGroup: ${AZURE_RESOURCE_GROUP}
        uses:
            - langgraph-deep-agents
        docker:
            path: Dockerfile
            remoteBuild: true
    frontend:
        project: frontend
        host: staticwebapp
        language: ts
        dist: dist
        resourceName: ${AZURE_STATIC_WEB_APP_NAME}
        resourceGroup: ${AZURE_RESOURCE_GROUP}
        uses:
            - backend
        hooks:
            prebuild:
                kind: js
                run: scripts/write-config.mjs
infra:
    layers:
        - { name: foundry, path: ".", provider: microsoft.foundry }
        - { name: backend, path: infra/backend, provider: bicep, dependsOn: [foundry] }
        - { name: frontend, path: infra/frontend, provider: bicep, dependsOn: [backend] }
